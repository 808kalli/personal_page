<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elias Kallioras — Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #1a1b1f;
  --bg-secondary: #202227;
  --bg-card: #26282e;
  --bg-card-hover: #2d3037;
  --text-primary: #e9eaec;
  --text-secondary: #a6aab3;
  --text-muted: #787d87;
  --accent: #6f9ceb;
  --accent-dim: rgba(111, 156, 235, 0.14);
  --accent-secondary: #d9a35f;
  --accent-secondary-dim: rgba(217, 163, 95, 0.16);
  --border: #383b43;
  --border-subtle: #2c2f36;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Space Grotesk', sans-serif;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--accent) var(--bg-secondary); }

body {
  font-family: var(--sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 80px clamp(24px, 5vw, 80px) 60px;
}

a { color: inherit; text-decoration: none; }

.back-link {
  font-family: var(--mono);
  font-size: 0.78rem;
  color: var(--text-muted);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 24px;
}
.back-link:hover { color: var(--accent); }

.page-header { margin-bottom: 48px; }

.page-title {
  font-family: var(--sans);
  letter-spacing: -0.5px;
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.page-subtitle {
  font-family: var(--mono);
  font-size: 0.8rem;
  color: var(--text-muted);
}

.list {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 760px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 24px 28px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 24px;
  align-items: start;
  transition: border-color 0.2s ease, background 0.2s ease;
}

.card:hover {
  border-color: var(--accent);
  background: var(--bg-card-hover);
}

.card a.title-link {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.4;
}
.card a.title-link:hover { color: var(--accent); }

.card .why {
  font-size: 0.84rem;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-top: 6px;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
}

.tag {
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--accent);
  background: var(--accent-dim);
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 0.3px;
}

.card-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}

.date {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--text-muted);
  white-space: nowrap;
}

.open-hint {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--text-muted);
  transition: color 0.2s;
}
.card:hover .open-hint { color: var(--accent); }

.empty-state, .error-state {
  font-family: var(--mono);
  font-size: 0.85rem;
  color: var(--text-muted);
  padding: 40px 0;
  max-width: 500px;
}

.error-state { color: var(--accent-secondary); }
</style>
</head>
<body>

<div class="page-header">
  <a href="index.html" class="back-link">← back to main</a>
  <h1 class="page-title">Reading</h1>
  <p class="page-subtitle">Everything marked "more like this" from the reading digest</p>
</div>

<div class="list" id="list">
  <p class="empty-state">Loading…</p>
</div>

<script>
const SOURCE = "https://raw.githubusercontent.com/808kalli/personal_page/main/digest/verdicts.json";

function fmtDate(iso) {
  try {
    return new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  } catch {
    return "";
  }
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s || "";
  return div.innerHTML;
}

async function render() {
  const list = document.getElementById("list");
  let entries;
  try {
    const res = await fetch(SOURCE, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    entries = await res.json();
  } catch (err) {
    list.innerHTML = `<p class="error-state">Could not load the list right now (${escapeHtml(String(err))}).</p>`;
    return;
  }

  const liked = entries
    .filter((e) => e.verdict === "liked")
    .sort((a, b) => new Date(b.recorded) - new Date(a.recorded));

  if (liked.length === 0) {
    list.innerHTML = '<p class="empty-state">Nothing liked yet. "More like this" links in the digest email land here.</p>';
    return;
  }

  list.innerHTML = liked.map((e) => `
    <div class="card">
      <div>
        <div class="tags"><span class="tag">${escapeHtml(e.source || "")}</span></div>
        <a class="title-link" href="${escapeHtml(e.url || "#")}" target="_blank" rel="noopener">${escapeHtml(e.title || e.id)}</a>
        ${e.why ? `<p class="why">${escapeHtml(e.why)}</p>` : ""}
      </div>
      <div class="card-right">
        <div class="date">${escapeHtml(fmtDate(e.recorded))}</div>
        <a class="open-hint" href="${escapeHtml(e.url || "#")}" target="_blank" rel="noopener">Open ↗</a>
      </div>
    </div>
  `).join("");
}

render();
</script>

</body>
</html>
