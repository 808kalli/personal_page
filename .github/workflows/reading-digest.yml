name: Reading digest

on:
  schedule:
    # Monday 06:00 UTC, which is 09:00 in Athens during summer time
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rank and print without sending or recording"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write      # closes the feedback issues it has ingested

concurrency:
  group: reading-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and send the digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python digest/digest.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Record what was judged
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -n "$(git status --porcelain digest/)" ]; then
            git config user.name "reading-digest"
            git config user.email "actions@github.com"
            git add -A digest/   # any of the state files may not exist yet
            git commit -m "Record digest candidates for $(date -u +%Y-%m-%d)"
            git push
          fi
